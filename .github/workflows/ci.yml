name: CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        env:
          API_KEY: local-demo-key
          PROVIDER_MODE: mock
          VECTOR_STORE_MODE: qdrant
        run: python -m pytest -q

      - name: Local eval smoke
        env:
          API_KEY: local-demo-key
          PROVIDER_MODE: mock
          VECTOR_STORE_MODE: qdrant
        run: python -m app.evals.run_eval --dataset sample_data/eval_dataset.json --top-k 4
